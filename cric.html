<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

.player{
    width:1000px;
    max-width:95%;
    background:black;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

video{
    width:100%;
    height:auto;
    background:black;
}

.top-bar{
    position:absolute;
    top:10px;
    left:10px;
    display:flex;
    gap:10px;
    align-items:center;
}

.live-badge{
    background:red;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.buffering{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    color:white;
    display:none;
}

.controls{
    position:absolute;
    bottom:0;
    width:100%;
    background:linear-gradient(transparent, rgba(0,0,0,0.9));
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

button, select{
    background:#1e1e1e;
    border:none;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

button:hover, select:hover{
    background:#333;
}

input[type=range]{
    width:120px;
}
</style>
</head>

<body>

<div class="player">
    <video id="video" autoplay muted playsinline></video>

    <div class="top-bar">
        <div class="live-badge">🔴 LIVE</div>
        <button id="goLive">Go Live</button>
    </div>

    <div class="buffering" id="buffering">Buffering...</div>

    <div class="controls">
        <button id="play">⏸</button>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
        <select id="quality"></select>
        <button id="fullscreen">⛶</button>
    </div>
</div>

<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("play");
const volume = document.getElementById("volume");
const fullscreenBtn = document.getElementById("fullscreen");
const buffering = document.getElementById("buffering");
const goLiveBtn = document.getElementById("goLive");
const qualitySelect = document.getElementById("quality");

const streamURL = "https://001.fclplayer.net/live/csstream2/playlist.m3u8?id=1002&pk=37c87b478743832a489c0827aec5db47c08866509704517a308ec563515646c7";

let hls;

// Load Stream
if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = streamURL;
}else if(Hls.isSupported()){
    hls = new Hls({
        liveSyncDurationCount: 3,
        maxBufferLength: 30
    });

    hls.loadSource(streamURL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        qualitySelect.innerHTML = '<option value="-1">Auto</option>';
        hls.levels.forEach((level, index) => {
            qualitySelect.innerHTML += `<option value="${index}">${level.height}p</option>`;
        });
    });

    qualitySelect.addEventListener("change", function(){
        hls.currentLevel = parseInt(this.value);
    });
}

// Play / Pause
playBtn.addEventListener("click", ()=>{
    if(video.paused){
        video.play();
        playBtn.innerText="⏸";
    }else{
        video.pause();
        playBtn.innerText="▶";
    }
});

// Volume
volume.addEventListener("input", ()=>{
    video.volume = volume.value;
});

// Fullscreen
fullscreenBtn.addEventListener("click", ()=>{
    if(!document.fullscreenElement){
        video.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
});

// Buffering Indicator
video.addEventListener("waiting", ()=>{
    buffering.style.display="block";
});

video.addEventListener("playing", ()=>{
    buffering.style.display="none";
});

// Go Live Button
goLiveBtn.addEventListener("click", ()=>{
    if(hls){
        video.currentTime = video.duration;
    }
});

// Error Handling
video.addEventListener("error", ()=>{
    alert("Stream failed. Check URL or server.");
});
</script>

</body>
</html>
